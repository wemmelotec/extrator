spring.application.name=extrator

# ========== OCR Configuration ==========
ocr.tesseract.datapath=C:/workspace_eclipse
ocr.tesseract.language=por+eng
ocr.tesseract.page-seg-mode=1
ocr.pdf.render-dpi=350
ocr.pdf.usar-texto-nativo=true
ocr.pdf.texto-nativo.min-chars=120
ocr.pdf.texto-nativo.min-letters=60
ocr.image.scale-factor=2.0

# ========== Database Configuration (H2) ==========
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== Document Storage Configuration ==========
document.storage.base-path=uploads/documentos


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration
app.elasticsearch.validate-on-startup=false
app.elasticsearch.enabled=false

ocr.tesseract.datapath=C:/workspace_eclipse
ocr.tesseract.language=por+eng
ocr.tesseract.page-seg-mode=1
ocr.pdf.render-dpi=350
ocr.pdf.usar-texto-nativo=true
ocr.pdf.texto-nativo.min-chars=120
ocr.pdf.texto-nativo.min-letters=60
ocr.image.scale-factor=2.0

document.storage.base-path=uploads/documentos
